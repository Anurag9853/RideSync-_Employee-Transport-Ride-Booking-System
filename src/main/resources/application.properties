spring.application.name=RideSync Backend

# ===============================
# Database Configuration (Railway)
# ===============================

spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===============================
# Security / JWT
# ===============================
ridesync.app.jwt-secret=${JWT_SECRET}
ridesync.app.jwt-expiration-ms=86400000

# ===============================
# Server
# ===============================
server.port=${PORT:8080}

spring.main.banner-mode=off
logging.level.org.springframework.security=INFO
