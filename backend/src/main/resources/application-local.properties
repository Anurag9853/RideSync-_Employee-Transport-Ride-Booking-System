# Local development profile using in-memory H2 database
spring.datasource.url=jdbc:h2:mem:ridesync;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
ridesync.app.jwt-secret=ridesyncSecretKey1234567890123456789012345678901234567890
ridesync.app.jwt-expiration-ms=86400000

# Server port
server.port=8080

logging.level.org.springframework.security=INFO
